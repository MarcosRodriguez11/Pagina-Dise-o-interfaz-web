<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyProte - Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

    <div class="top-bar">⚡ INICIA SESIÓN Y CONSIGUE PUNTOS MyProte EN CADA COMPRA ⚡</div>

    <header class="main-header">
        <a href="inicio.html" class="logo">⚡ MyProte</a>
        <nav class="nav-links">
            <a href="inicio.html">🏠 Inicio</a>
            <a href="index.html">📦 Catálogo</a>
            <a href="cuenta.html">👤 Mi cuenta</a>
            <a href="cesta.html">🛒 Mi cesta <span class="badge-count">3</span></a>
            <a href="login.html" class="active">🔑 Entrar</a>
        </nav>
    </header>

    <main class="auth-wrapper">
        <form class="auth-card" id="form-login">
            <h1 class="brand-title">Iniciar sesión</h1>
            <p class="auth-subtitle">Bienvenido de nuevo a MyProte</p>

            <div class="form-group">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" minlength="6" required>
            </div>
            <label class="auth-check"><input type="checkbox" name="recordar"> Recordarme</label>

            <button type="submit" class="btn-buy">Entrar</button>

            <p class="auth-footer">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </form>
    </main>

    <footer class="main-footer">
        <a href="https://github.com/MarcosRodriguez11/Pagina-Dise-o-interfaz-web">MyProte</a> © 2026 by <a href="https://github.com/MarcosRodriguez11">Marcos Rodriguez</a> is licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a><img src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;"><img src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;"><img src="https://mirrors.creativecommons.org/presskit/icons/sa.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;">
    </footer>

    <script>
        // Sin servidor: al entrar se va al panel de la cuenta
        document.getElementById('form-login').addEventListener('submit', e => {
            e.preventDefault();
            location.href = 'cuenta.html';
        });
    </script>

</body>
</html>
