<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyProte - Crear cuenta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

    <div class="top-bar">⚡ REGÍSTRATE Y LLÉVATE UN 10% EN TU PRIMER PEDIDO ⚡</div>

    <header class="main-header">
        <a href="inicio.html" class="logo">⚡ MyProte</a>
        <nav class="nav-links">
            <a href="inicio.html">🏠 Inicio</a>
            <a href="index.html">📦 Catálogo</a>
            <a href="cuenta.html">👤 Mi cuenta</a>
            <a href="cesta.html">🛒 Mi cesta <span class="badge-count">3</span></a>
            <a href="login.html">🔑 Entrar</a>
        </nav>
    </header>

    <main class="auth-wrapper">
        <form class="auth-card" id="form-registro">
            <h1 class="brand-title">Crear cuenta</h1>
            <p class="auth-subtitle">Únete a MyProte en menos de un minuto</p>

            <div class="form-row-2col">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Marcos" autocomplete="given-name" required>
                </div>
                <div class="form-group">
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos" placeholder="Rodríguez" autocomplete="family-name" required>
                </div>
            </div>
            <div class="form-group">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" minlength="6" required>
            </div>
            <div class="form-group">
                <label for="password2">Repite la contraseña:</label>
                <input type="password" id="password2" name="password2" autocomplete="new-password" minlength="6" required>
            </div>
            <label class="auth-check"><input type="checkbox" name="terminos" required> Acepto los términos y la política de privacidad</label>

            <button type="submit" class="btn-buy">Crear cuenta</button>

            <p class="auth-footer">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </form>
    </main>

    <footer class="main-footer">
        <a href="https://github.com/MarcosRodriguez11/Pagina-Dise-o-interfaz-web">MyProte</a> © 2026 by <a href="https://github.com/MarcosRodriguez11">Marcos Rodriguez</a> is licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a><img src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;"><img src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;"><img src="https://mirrors.creativecommons.org/presskit/icons/sa.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;">
    </footer>

    <script>
        const form = document.getElementById('form-registro');
        const pass2 = document.getElementById('password2');
        // Comprueba que las dos contraseñas coinciden
        const pass1 = document.getElementById('password');
        const comprobar = () => {
            pass2.setCustomValidity(pass2.value === pass1.value ? '' : 'Las contraseñas no coinciden');
        };
        pass1.addEventListener('input', comprobar);
        pass2.addEventListener('input', comprobar);
        form.addEventListener('submit', e => {
            e.preventDefault();
            location.href = 'login.html';
        });
    </script>

</body>
</html>
